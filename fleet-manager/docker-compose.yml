services:
  nginx:
    image: nginx:alpine
    container_name: fleet-nginx
    restart: always
    ports:
      - "5001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui

  api:
    build: ./api
    container_name: fleet-api
    restart: always
    expose:
      - "5000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/.ssh:/root/.ssh:ro

  ui:
    build: ./ui
    container_name: fleet-ui
    restart: always
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fleet_postgres_data:
