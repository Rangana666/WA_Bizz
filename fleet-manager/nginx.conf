upstream fleet_api { server api:5000; }
upstream fleet_ui  { server ui:3000; }

server {
    listen 80;

    # API routes → fleet-api container
    location ~ ^/(admin|billing|heartbeat|updates|health) {
        proxy_pass http://fleet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Stripe webhook (needs raw body)
    location /billing/webhook {
        proxy_pass http://fleet_api;
        proxy_set_header Host $host;
    }

    # Socket.io live updates
    location /socket.io/ {
        proxy_pass http://fleet_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React SPA → fleet-ui container
    location / {
        proxy_pass http://fleet_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
