version: "3.9"
# ─── Local development compose ────────────────────────────────────────────────
# No SSL. Ports exposed directly. Hot-reload friendly.
# Usage:  docker compose -f docker-compose.dev.yml up -d
#    or:  make up

services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evo-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://bot:4000/webhook
      - LOG_LEVEL=WARN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evo_dev_data:/evolution/instances

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: bot-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - EVOLUTION_API_URL=http://evolution:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bot/src:/app/src        # Live code mount for hot reload
      - uploads_dev:/app/uploads
    command: ["node", "src/index.js"]   # swap to nodemon for auto-restart

  dashboard:
    image: node:20-alpine
    container_name: dash-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:5173"   # Vite dev server → localhost:3000
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    depends_on:
      - bot

  postgres:
    image: postgres:16-alpine
    container_name: pg-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/phase6.sql:/docker-entrypoint-initdb.d/02-phase6.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_dev_data:
  redis_dev_data:
  evo_dev_data:
  uploads_dev:
